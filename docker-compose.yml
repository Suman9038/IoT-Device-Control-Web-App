version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: iot-control-app
    ports:
      - "8000:8000"
    env_file:
      - .env.production  # External file se load karo
    depends_on:
      - db
      - mqtt-broker
    networks:
      - iot-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: iot-mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iot-network
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: iot-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - iot-network
    restart: unless-stopped

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_logs:

networks:
  iot-network:
    driver: bridge
